name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: OrderManagement.slnx
  CONFIGURATION: Release

jobs:
  architecture-gate:
    name: Build & ADR Architecture Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: Architecture tests (ADR gate)
        run: >
          dotnet test ${{ env.SOLUTION }}
          -c ${{ env.CONFIGURATION }}
          --no-build
          --filter "FullyQualifiedName~OrderManagement.ArchitectureTests"
          --logger "trx;LogFileName=architecture-tests.trx"
          --results-directory ${{ github.workspace }}/artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn